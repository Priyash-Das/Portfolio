<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Priyash Das | Message Sent</title>
  <link rel="icon" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/abstract/variables.css" />
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/base/typography.css" />
  <link rel="stylesheet" href="css/layout/grid.css" />
  <link rel="stylesheet" href="css/layout/cube.css" />
  <link rel="stylesheet" href="css/components/navigation.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/forms.css" />
  <link rel="stylesheet" href="css/components/preloader.css" />
  <link rel="stylesheet" href="css/components/glassBackground.css" />
  <link rel="stylesheet" href="css/components/resumeOverlay.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages/confirmation.css" />
  <link rel="modulepreload" href="js/modules/particles.js" />
  <link rel="modulepreload" href="js/modules/cursor.js" />
  <link rel="modulepreload" href="js/modules/glassBackground.js" />
  <link rel="modulepreload" href="js/modules/preloader.js" />
  <link rel="modulepreload" href="js/modules/contentProtection.js" />
</head>

<body>
  <div id="preloader" role="alert" aria-label="Loading content">
    <div class="preloader-grid"></div>
    <div class="preloader-corners">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-br"></span>
      <span class="corner corner-bl"></span>
    </div>
    <div class="preloader-content">
      <p id="status-text" aria-live="polite"></p>
    </div>
    <div class="scanline"></div>
  </div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas><canvas id="cursor-line" aria-hidden="true"></canvas>
  <main class="confirmation-container preload-content">
    <div class="confirmation-card">
      <header class="confirmation-header">
        <h1 data-text="Message Sent Successfully!">Message Sent!</h1>
      </header>
      <div class="email-preview">
        <div class="email-header">
          <span class="email-icon" aria-hidden="true">✉️</span>
          <div>
            <span class="email-to">To: priyashalucard@gmail.com</span>
          </div>
        </div>
        <p class="email-content">
          Thank you for reaching out! I'll get back to you faster than a 5G
          ping ⚡️
        </p>
      </div>
      <a href="index.html" class="btn back-btn">Go To Home</a>
    </div>
  </main>
  <script type="module" src="js/pages/confirmation.js"></script>
</body>

</html>
